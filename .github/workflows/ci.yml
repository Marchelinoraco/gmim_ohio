# CI — lint + typecheck + unit tests + e2e on every PR and every push to master.
# Catches regressions before merge; production auto-deploys from `master` via Vercel.
#
# Neon `ci` branch + a TEST_DATABASE_URL secret are deferred to Rencana 3 — no
# DB-touching tests exist yet (unit tests read plain data modules; e2e only
# renders public pages). The dummy DATABASE_URL on the e2e step below is just
# URL-shaped so `src/lib/env.ts` (Zod) parses; nothing opens a connection.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node so its `cache: pnpm` can resolve.
      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/routeTree.gen.ts` and `src/paraglide/**` are git-ignored and only
      # emitted by the Vite build (no standalone route-tree CLI ships in this
      # dep set). Run the build first so the later `pnpm typecheck` can resolve
      # `./routeTree.gen` and `@/paraglide/*`. The build itself is also a check.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer runs `pnpm dev`; TanStack Start SSR evaluates the
      # whole route tree — including `src/routes/api/auth/$.ts` -> `@/lib/auth`
      # -> `@/lib/env` — so the dev server refuses to start without these.
      # All three are CI-only fakes, NOT real secrets: the e2e suite never
      # touches auth or the database.
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci # CI-only, not real; never connected to
          BETTER_AUTH_SECRET: ci-dummy-secret-not-used-in-ci-0000 # CI-only fake (>= 16 chars)
          BETTER_AUTH_URL: http://localhost:3000 # CI-only, not real

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
