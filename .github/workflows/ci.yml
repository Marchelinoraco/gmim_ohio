# CI — lint + typecheck + unit tests + e2e on every PR and every push to master.
# Catches regressions before merge; production auto-deploys from `master` via Vercel.
#
# Rencana 2a's `tests/e2e/public-pages.spec.ts` navigates to /warta, /renungan,
# /galeri, /kunjungi, /persembahan, /ibadah-live and /beranda — every one of those
# has a loader that opens a real database connection. That invalidated the old
# "dummy URL-shaped DATABASE_URL, nothing ever connects" arrangement (17 of 20
# tests in that spec failed against it). So CI now runs a throwaway Postgres
# service, migrates it and seeds it before the e2e step.
#
# The service DB is ephemeral and local to the runner — it is NOT Neon. Neon
# `production` is never touched by CI.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Throwaway Postgres for the e2e step. Ephemeral per run; nothing persists.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gmim_ci
        ports:
          - 5432:5432
        # Without a healthcheck the migrate step can race the container's boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points at the service container above. Migrate, seed and the e2e dev
      # server all read this. No sslmode — it is a plain local Postgres, not Neon.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gmim_ci
      # `src/lib/env.ts` requires these two (not `.optional()`), and `pnpm db:seed`
      # imports `@/db` -> `@/lib/env`, so they must be set for the seed step too —
      # not just for the e2e dev server. CI-only fakes, NOT real secrets: nothing
      # in CI signs in.
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-in-ci-0000 # >= 16 chars
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # pnpm must exist before setup-node so its `cache: pnpm` can resolve.
      # Version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `src/routeTree.gen.ts` and `src/paraglide/**` are git-ignored and only
      # emitted by the Vite build (no standalone route-tree CLI ships in this
      # dep set). Run the build first so the later `pnpm typecheck` can resolve
      # `./routeTree.gen` and `@/paraglide/*`. The build itself is also a check.
      - run: pnpm build

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec playwright install --with-deps chromium

      # Schema + placeholder content for the DB-backed public pages. `db:seed` is
      # idempotent, and this database is thrown away with the runner.
      - run: pnpm db:migrate
      - run: pnpm db:seed

      # Playwright's webServer runs `pnpm dev`; TanStack Start SSR evaluates the
      # whole route tree — including `src/routes/api/auth/$.ts` -> `@/lib/auth`
      # -> `@/lib/env` — so the dev server needs all three vars. They come from
      # the job env above; DATABASE_URL there IS connected to.
      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
